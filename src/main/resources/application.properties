spring.application.name=TraktoRoute

spring.datasource.url=jdbc:mysql://${DATABASE_URL:${MYSQLHOST:localhost}}:${DATABASE_PORT:${MYSQLPORT:3306}}/${DATABASE_NAME:${MYSQLDATABASE:trakto-route-db}}?useSSL=true&serverTimezone=UTC&createDatabaseIfNotExist=true&publicKeyRetrieval=true
spring.datasource.username=${DATABASE_USER:${MYSQLUSER:root}}
spring.datasource.password=${DATABASE_PASSWORD:${MYSQLPASSWORD:12345678}}

# Developer-friendly JPA behavior
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# App port
server.port=${PORT:8080}

documentation.application.title=Trakto API
documentation.application.description=Trakto Route backend API
documentation.application.version=1.0
